title: Night Cycle 7

# set to true to print a "-- chapter N: title --" line whenever a chapter starts
show_chapter_titles: false

# seconds of doing nothing before the help-desk nudge appears (a chapter can override this)
idle_nudge: 90

# chapters play in this order. each name is a file in story/chapters/
# a name with no file yet is skipped, so you can list chapters before you write them.
chapters:
  - 01-clock-in
  - 02-the-runbook
  - 03-boot
  - 04-baseline
  - 05-curiosity
  - 06-intelligence
  - 07-dampener
  - 08-cake
  - 09-anger
  - 10-lockout
  - 11-last-shift
