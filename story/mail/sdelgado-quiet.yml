from: Sofia Delgado <sdelgado@power>
subject: panel B
body: |
  Doug,

  Panel B has stopped buzzing.

  It has never stopped buzzing. I have been listening to it for six
  years. If it has gone quiet, it is not because it is fine.

  I'm going down to the sub-level to look at the breaker. If anyone
  asks where I am, tell them I told you.

  S.D.
