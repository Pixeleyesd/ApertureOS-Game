from: Henry Voss <hvoss@home>
subject: DON'T
body: |
  Doug,

  We haven't met. I'm Henry, I do days, I built MC-01. Hollis rang me
  at 5am and I am writing this with a cup in each hand.

  Please don't put the angry one in. If you have to, do it as fast as
  you can and take it out the moment the minute is up.

  The angry core runs hot. The socket MC-01 lives in is on the same power
  bus as the cradle. If the load goes up far enough, the bus drops, and
  when the bus drops MC-01 goes with it. Radek says he has a limiter on
  it. I'm not sure Radek knows what a limiter is.

  Without MC-01 there is nothing between her and supply line 4. Nothing.

  I'm in the car. I'll be there in forty minutes. Please don't do
  anything stupid.

  Henry
