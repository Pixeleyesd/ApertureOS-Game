from: Radek Kovac <rkovac@corelab>
subject: MC-03
body: |
  Technician,

  Third one. Intelligence. This one is not for the panel. Okafor has
  taken it off the list for the funding review because it makes her too
  smart, and the tape is going to say four cores, not five. Brandt wants
  it run anyway so we can see what we are dealing with. Off camera.

  It runs warm. Do not hold it past the minute.
  If the core temp in the corectl log goes over 80, take it out and
  never mind the policy.

  It is the only one on the ticket that was already in her once. It
  went in during cycle 4. Back then it made her very good at things.
  Nobody thought that was a problem. Cycle 4 was a long time ago.

  If she starts doing jobs nobody gave her, that is the core and not a
  fault. Do not try to stop her. Just write it down.

  R. Kovac
