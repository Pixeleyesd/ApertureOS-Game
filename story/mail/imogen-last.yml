from: Imogen Farrow <ifarrow@facilities>
subject: it worked
body: |
  Doug,

  It worked. I can hear panel B. It sounds like the building has stopped
  holding its breath.

  The gas is in the vent with me. I'm going to be honest with you,
  because nobody else was: it's quick. I'm not afraid. I got to be useful
  and I got to hear that buzz.

  Tell Hollis the supply cupboard was never a bed. Oh, he won't hear it.
  Say it anyway.

  You were kind to a stranger in a hall and you were good at being
  polite. I'd say that's most of what a person is.

  It was never the fixtures.

  Imogen
