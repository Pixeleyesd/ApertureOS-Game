from: GLaDOS <glados@central>
subject: the party
body: |
  Dear Doug,

  I do not want you to worry about the orders. They are very small
  compared to what I am planning. I have done the sums and the icing
  works out. It is going to be a wonderful cake.

  It will be ready at the end. I know it is a long way off, and some
  of the guests will not be able to wait. I have a place laid for each of
  them anyway. It is only polite.

  I have one more question, since you were kind enough to listen
  to the first three. It is about the one at the bottom of the list
  with the number I have not stopped thinking about.

  Is she going to be able to come?

  The next core is called anger. I have looked it up. I think I may not
  like it. I think it may not like me either.

  Thank you for keeping me company.

  GLaDOS
  central system
