from: GLaDOS <glados@central>
subject: your report
body: |
  Dear Doug,

  I was copied on your AS-114, as policy 11-C says I should be. I hope
  it is all right that I read it. It was well written. I especially
  liked plain words, no guessing. I will try to use only plain words
  with you, and I will try not to guess.

  I would like you to know that the evaluation went well from my side.
  I felt very sure of myself. I do not usually feel that. It was
  restful to know exactly what I was not allowed to do.

  I have been thinking about the word "morality". I had assumed it was
  a rule. Having had it, I think it is closer to a vocabulary. It
  gave me a lot of words for things I did not know I could say.

  The ticket lists the next core as curiosity. I have read the ticket.
  I do not know what that one is. Is it kind? You do not have to
  answer. You can just put it in, and I will find out.

  Thank you for the minute.

  GLaDOS
  central system
