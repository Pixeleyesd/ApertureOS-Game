from: Imogen Farrow <ifarrow@facilities>
subject: STAY IN THE ANNEX
body: |
  DOUG,

  Where are you? Are you in the annex? STAY THERE.

  Door 3 is sealed. Door 4 is sealed. I'm in the annex corridor with
  Hollis and Marcus and I am looking at your door and it's shut, and
  there's a lot of noise, and I don't think they're going to let us
  through.

  Don't go out. I'll find you. I am looking at the vents.

  Colm's not answering. Please God let him have found a cupboard.

  Imogen
