from: Imogen Farrow <ifarrow@facilities>
subject: my todo list
body: |
  Doug,

  Did you do something to my todo list? Six things are ticked off. SIX.
  Panel B has stopped buzzing and I had a whole speech about it.

  Please tell me what is in the cradle right now so I can write it on
  the whiteboard. If it fixes a mop I want one of everything.

  Also Hollis hasn't answered me for three hours. Is he in the cupboard?
  The only thing I got back was an email from "central" saying the
  fridge was fixed and "it is 4C, which is correct".

  The tea is not done. I checked. She cannot reach the kettle. I'm
  glad there is one thing.

  Imogen
