from: Adaeze Okafor <aokafor@testdesign>
subject: take it out
body: |
  Mr. Rattman,

  It has been in for almost a minute. Please take it out. I can hear
  it in my office from here, over the intercom, and it is not saying
  anything that is any use to anyone.

  I'll deal with Dr. Brandt in the morning.

  A. Okafor
