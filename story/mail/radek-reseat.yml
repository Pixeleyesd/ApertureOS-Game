from: Radek Kovac <rkovac@corelab>
subject: MC-01
body: |
  Technician,

  I put MC-01 back in from the lab side as soon as you pulled it. Primary
  socket. It is in now and it is staying in.

  It is the only one of the five that does anything about the supply
  line. I tested every one on the bench. The rest change her mood.
  MC-01 is the one that stops the gas.

  So: you use the annex cradle for the others, as normal. You do not
  touch the primary socket. If anybody tells you to, you ring me first.

  I don't care what Okafor's chart says.

  R. Kovac
