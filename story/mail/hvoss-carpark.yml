from: Henry Voss <hvoss@home>
subject: the doors
body: |
  Doug,

  I'm in the car park. My badge doesn't work. None of the doors are
  opening. I can see the lights going out on L5 through the glass.

  I can hear the alarms from here.

  Tell me what MC-01's panel says. Tell me if it's the primary socket
  or if it's the lead. If it's the lead I can fix it by hand, I only
  need somebody to open the door.

  Please just answer me. I don't want to stand here.

  H.V.
