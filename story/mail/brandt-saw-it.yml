from: Hollis Brandt <hbrandt@supervisors>
subject: re: central
body: |
  Doug,

  Saw the service flip on my side, thats's good. Don't read anything
  into the lights though, they do that.

  Two things and then I'm going back to my slides, which are honestly
  terrible.

  1. Write down the time it says READY. Not when you think it did.
     When it SAYS it did, understand?
  2. Do not talk to her first. I don't care how friendly she sounds.
     Runbook item 8. I wrote that one myself, in capitals, in the
     first draft, and I genuinely don't remember why. So don't.

  Oh, and if anything weird happens, write it down. Don't fix it, we
  don't want any accidents to happen, do we?

  H.B. (ext 4410)

  p.s. if the review people ask, yes the runbook is "in draft".
  no, I don't know why it's still in draft.
