from: Tobias Wren <twren@cafeteria>
subject: THE CAKE ONE!!
body: |
  Doug!

  Hi!! Tobias, cafeteria. I know you don't know me. I don't really
  know you. But I saw the cakes core on the board in the lift and I
  asked about it for a MONTH and then Dr. Okafor said "fine" to make me
  go away so it is ON THE TICKET!!!

  So. When it is in she will want to talk about cake. Please let her.
  I put a note in her recipe file so it is a nice one. Chocolate. With
  icing. Nobody in here has had cake since the Christmas party.

  If she asks to order things, say yes. I told her she could. I have
  twelve plates.

  Thank you thank you!

  Tobias
