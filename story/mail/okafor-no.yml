from: Adaeze Okafor <aokafor@testdesign>
subject: no
body: |
  Mr. Rattman,

  I'm told Dr. Brandt has asked you to fit a sixth core. I want that on
  the record: I did not approve it and I would like you not to.

  The review is about four cores. Every minute with an extra one is a minute
  that doesn't count, and she knows it. She keeps her own notes.

  If you do put it in, I would like it out again at once. And if it
  says anything I'd like you to treat it as noise.

  A. Okafor
