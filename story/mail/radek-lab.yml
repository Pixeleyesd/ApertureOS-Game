from: Radek Kovac <rkovac@corelab>
subject: it dropped
body: |
  Technician,

  MC-01 has lost its power. The limiter went. I'm in the Core Lab, the
  seal is still open, and I cannot get the primary socket back on.

  I can see supply line 4 on my panel. It is open. The gas is in the
  vault corridor already and it is coming this way.

  I told Henry the bus was fine. I told him it was fine.

  If you can hear me: do not leave the annex. The annex is above the
  gas. It has its own air.

  I'm sorry.

  R.K.
