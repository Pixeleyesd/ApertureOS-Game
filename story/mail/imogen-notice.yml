from: Imogen Farrow <ifarrow@facilities>
subject: re: L2 lighting notice
body: |
  Doug,

  Got your notice, thank you. Nobody ever sends me one. Hollis just
  walks in and says "can we do the lights" like I'm a switch :/.

  Two things.

  The last time anybody lit that corridor on purpose, the whole breaker
  panel in the annex buzzed for about a minute and then stopped. I put
  it in the log as "probably nothing". Keep a hand off anything electrical
  and don't go into the Core Lab. Radek keeps that seal stuck on purpose
  and he won't tell me why. Idk whats going on in there, but I don't
  want to find out the hard way.

  Second: Tobias in the cafeteria asked me what the "evaluation" is.
  I told him I have no idea. Please don't tell me either. I would
  like to be able to say that to the funding review with a straight face.

  Colm is doing the L2 floors around midnight. If you hear a mop and
  then a very small scream, that's normal, don't ask.

  Imogen
