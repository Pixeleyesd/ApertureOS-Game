from: Imogen Farrow <ifarrow@facilities>
subject: welcome to nights (and the thermostat)
body: |
  Hi Doug,

  Hollis said you were starting tonight, so here's the unwritten rules.

  - Coffee in the annex is not coffee. The machine on level 2 is better
    and takes badge credits.
  - There is a bucket under your desk. Don't ask. Just leave it
    where it is and empty it if it gets above the line I drew on it.
  - Corridor lights on L2 have been flickering all week. I've swapped
    three fixtures. It isn't the fixtures. It's probably nothing.
  - If a terminal does something weird, tell me before you tell IT.
    I get faster results and I will not make you fill in a form. It's
    better they don't know what happens in certain situations.

  Also, I know Hollis told you to read your ticket properly. Read it,
  he's gonna to ask you questions about it at the review and he
  will absolutely pretend it was your idea.

  Welcome aboard. It's a quiet shift. I'm on L2 if you need me.

  Imogen
  Facilities
