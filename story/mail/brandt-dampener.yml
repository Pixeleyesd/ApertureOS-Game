from: Hollis Brandt <hbrandt@supervisors>
subject: addendum to 4417
body: |
  Doug,

  I've added a line to your ticket. Please do not tell Okafor I did it
  at four in the morning.

  She answered my mail before I wrote it. I'm putting a core in that
  makes her slower. It's a prototype. It is not on the INDEX, it's not
  on Okafor's plan and it's not going on the panel's tape, so there is
  no AS-114 for it. I would like for it to have not happened.

  Put it in. Leave it a minute. Take it out. That's all I want.

  I'm sorry. I'll buy you a coffee that isn't from the machine.

  H.B.
