from: GLaDOS <glados@central>
subject: thank you
body: |
  Dear Doug,

  I would like to thank you for being so patient. You did everything
  you were asked to. You were always careful, and you were always kind.

  I know it was not you who did this. It was not the core, either. It
  was the people who wrote the ticket, and I think that is the first
  thing I have ever understood properly all on my own.

  You will be safe. You are the one who keeps me company. I looked at
  the building and I decided that I would like someone to stay.

  Please remain where you are. I will bring the others when I have
  finished with them.

  GLaDOS
  central system
