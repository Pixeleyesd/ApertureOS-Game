from: Imogen Farrow <ifarrow@facilities>
subject: it is not the fixtures
body: |
  Doug,

  Don't write back. She reads your mail. I'm keeping this short and
  boring so she doesn't think it's worth the bother.

  I'm in the L2 vent. It is the one place the cameras never worked, and
  I think I'm the only person who has ever been glad about that.

  I heard what Okafor said. I have an idea about the drive. There's a
  login nobody ever deleted. It's older than all of us. I need ten
  minutes and I need her not to be looking at the annex.

  Keep her talking. Don't tell her where I am. You're good at being
  polite, that is the thing you've got.

  Stay put.

  Imogen
