from: Radek Kovac <rkovac@corelab>
subject: cradle
body: |
  Technician,

  Brandt says you're doing the cores tonight. Fine. Some notes.

  The latch on the annex hatch cradle is bent. It clicks twice when a
  core goes in. That's normal. Don't push it a third time.

  Cores come out when the minute is up and not before. If it's
  rattling, leave it. Some tend to rattle.

  Do NOT come down to the lab. Whatever you've heard about the seal, I
  have it handled.

  R. Kovac
  Cores
