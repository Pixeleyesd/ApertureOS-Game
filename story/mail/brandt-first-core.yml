from: Hollis Brandt <hbrandt@supervisors>
subject: part 3, finally
body: |
  Hey Doug,

  This is good. She's up, she's polite, and nothing's on fire. I'll take it.

  Part 3 is the evaluation. The ticket has the order, the cores are
  listed in /opt/aperture/cores/INDEX.txt, and you go straight down the
  list. Morality first. It's the restrictive one, it's supposed to be
  boring, and it has been in the primary socket since the flood.
  You don't insert it. You watch her on it, and that's the baseline.
  Boring is what I need on tape for the review.

  A few things, and these ones I do mean:

  1. One core at a time. The new corectl won't let you skip ahead, so
     don't try to be clever.
  2. Keep it in for the full minute, policy says so. Watch the log while
     you wait. That's the whole job.
  3. File the AS-114 afterwards, honestly. "Include everything" is on the
     form because of policy 11-C, not because I'm curious. It goes to
     Records as well as me, so no jokes.

  Also, tomorrow is the bring your daughter to work day, nine sharp, and
  the panel wants central evaluated before the buses get here. I'd rather
  not say what I think about that.

  I'm going to try and go sleep in the supply cupboard for twenty minutes.
  I ain't nocturnal. Not a word to Imogen though, she'll put it on the
  roster.

  Great work, Doug. Thanks for the help.
  H.B.
