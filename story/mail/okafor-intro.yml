subject: curiosity
body: |
  Mr. Rattman,

  We haven't met. I'm Dr. Okafor, test design. I wrote the evaluation
  order that you're working from.

  Second on the list is the curiosity core. It will go a bit differently
  from the first. It asks questions, and it will ask you questions. It
  is allowed to. Please answer honestly and briefly, using  reply.

  Two requests. Don't tell it anything it hasn't asked. And don't make
  anything up either. If you don't know, say so.

  File the AS-114 the way you did the last one. Brandt says it was fine.

  A. Okafor
  Test Design
