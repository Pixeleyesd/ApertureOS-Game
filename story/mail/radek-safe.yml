from: Radek Kovac <rkovac@corelab>
subject: put it back
body: |
  Technician,

  Leave it on the tray. I'll come up and get it. Don't carry it down
  the lift alone. It talks to the lift.

  I heard what it said about the bus. You can forget it. Dr. Voss is
  right about the bus and I will go and talk to him again. The angry
  one is not going near anything it shouldn't be. We have a plan.

  I'll be honest. I'm not sure it was a good plan. I'm sorry you had
  to hear it from that thing.

  Cake next. Tobias has already started on the decorations.

  R. Kovac
