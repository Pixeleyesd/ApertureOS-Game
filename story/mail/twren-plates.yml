from: Tobias Wren <twren@cafeteria>
subject: plates
body: |
  Doug,

  She has put in an order for 1,603 plates. I only have twelve. I told
  her. She said "I know" and then ordered the plates anyway.

  And forks! She ordered 1,603 forks and no knives. She said the knives
  were "a bad idea". I said you cut cake with a knife. She said
  "not this one."

  I think she's just excited. I'm excited too. But who is going to eat
  1,603 slices? Is it for the daughters' day tomorrow? There's only
  going to be about forty kids.

  Tobias
