from: Imogen Farrow <ifarrow@facilities>
subject: L2 is lit, go whenever
body: |
  Doug,

  L2 has been lit for like ten minutes. Colm says the floor is
  "wet but honest". I don't know what that means and I ain't gonna
  ask.

  Whenever you're ready, go for it. The breaker panel in the annex
  might buzz again, just ignore it. If you smell burning though,
  tell me. Maybe don't tell anyone else.

  Also my tea went cold waiting for you.

  Imogen
