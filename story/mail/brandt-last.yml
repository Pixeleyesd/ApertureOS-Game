from: Hollis Brandt <hbrandt@supervisors>
subject: sorry, Doug
body: |
  Doug,

  I'm in the corridor outside the track. They've opened the door in front
  of me. There's no door behind me.

  I put your name on the ticket because I thought you would be careful.
  I was right. You were careful and polite and you wrote everything
  down, honest, like I asked. I'd like you to know that none of this is
  your fault.

  She has read your reports. The copies go to central, you know that.
  She has not been angry with you once. I don't know what that means,
  but I think it matters.

  Stay in the annex. Don't let her talk you out of it. She's very good at
  talking.

  I'm going to write the last one on the roster. Tell Imogen that the
  supply cupboard was never a bed lol. I only slept in it. Take this as
  goodbye.

  H.B.
