from: Radek Kovac <rkovac@corelab>
subject: the other one
body: |
  Technician,

  Hollis has been in my office. He wants the sixth one on the ticket
  tonight. I told him it isn't ready. He said "she's reading my mail".

  MC-06. I made it this spring after intelligence made her too good.
  It slows her down, because it is very, very busy being itself. Does
  not take instruction. Talks. A lot. I have it in the cradle tray, in
  the little box, with the lid on.

  It is cheerful. It means no harm. It will not stop saying so.

  The latch is the same. Count two clicks. Do not leave it in longer
  than you have to, for all our sakes.

  R. Kovac
