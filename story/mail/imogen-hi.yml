from: Imogen Farrow <ifarrow@facilities>
subject: hi
body: |
  Doug,

  I have just had 31 emails from "core6@annex". All of them say "hi".
  One says "hi, it's me again". One says "sorry about the lights".

  Is that the thing in your cradle? Is it a person? It sounds like a
  person. It sounds like a person who has been told off a lot.

  I'm going to leave a biscuit on the annex desk. Tell it I said hello.

  Imogen
