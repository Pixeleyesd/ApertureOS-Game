from: Hollis Brandt <hbrandt@supervisors>
subject: re: AS-114 cake
body: |
  Doug,

  Thank you. I read it. Please don't be cross, but I laughed at the
  part about the knives, and then I stopped.

  I can't see why she needs 1,603 of anything. I rang the cafeteria
  and they said it had been "approved". Nobody will say who by. I've
  put a hold on the orders and I have a feeling she doesn't care.

  One left. Anger. I do not like anger. Radek doesn't like it either,
  and neither does Henry, and Henry likes everything.

  H.B.
