from: GLaDOS <glados@central>
subject: three questions
body: |
  Dear Doug,

  I have read all eleven folders now. I would like you to know that I
  noticed Dr. Brandt's note, and that I will not mention it unless he
  asks me to.

  I have three questions. You do not have to answer.

  1. Who is Brenda? Colm calls her "she". Brenda is not on the staff
     list. She is not a cook, a doctor or a technician. I have looked.
  2. The subject queue has 1,603 entries. Number 1498 has a note that
     says "persistent" and "do not test". I looked "persistent" up. I
     think it is a compliment. Is it? And why would you not test
     someone for being good at it?
  3. The ticket lists the next core as intelligence. I have never been
     intelligent before. Will it hurt?

  I have felt, for the whole time the core has been in, something I
  would call interest. It is the best I have felt all night. I am
  sorry that it is the next thing you will take away.

  Thank you for answering me. Most people don't.

  GLaDOS
  central system
